[project.scripts]
agentinputlab = "agentinputlab.cli.main:main"
agentinputlab-experiments = "agentinputlab.experiments.cli:main"
agentinputlab-studio = "agentinputlab.studio.server:main"
agentinputlab-annotate = "agentinputlab.annotation.server:main"
agentinputlab-serve = "agentinputlab.api:main"

[project.urls]
Homepage = "https://data-designer.github.io/AgentInputLab/"
Repository = "https://github.com/Data-Designer/AgentInputLab-toolkit"
Documentation = "https://github.com/Data-Designer/AgentInputLab-toolkit/blob/main/docs/getting-started.md"
Issues = "https://github.com/Data-Designer/AgentInputLab-toolkit/issues"

[tool.setuptools]
package-dir = {"" = "src", "workers" = "workers"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["agentinputlab*", "workers", "workers.*"]

[tool.setuptools.package-data]
"*" = ["*.json"]
"agentinputlab" = ["py.typed"]
"agentinputlab.benchmarks" = ["data/*.json"]
"agentinputlab.registry" = ["data/*.json"]
"agentinputlab.artifacts" = ["fixtures/*.json"]
"agentinputlab.studio" = ["static/*.html", "static/*.css", "static/*.js"]
"agentinputlab.annotation" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.setuptools.data-files]
"share/agentinputlab" = ["CITATION.cff"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "tools"]
markers = [
  "integration: multi-component offline integration tests",
  "parity: upstream semantic parity tests",
  "security: security and isolation tests",
]

[tool.coverage.run]
branch = true
source = ["agentinputlab"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Alpha baseline measured with branch coverage across core and optional seams.
# Raise this ratchet as real upstream parity tests replace protocol fixtures.
fail_under = 75

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "UP038"]
