name: Publish approved PyPI release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version from pyproject.toml
        required: true
        type: string
      commit:
        description: Full main-branch commit SHA approved for release
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pypi-publication
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'Data-Designer/AgentInputLab-toolkit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require approved identity and successful cross-version CI
        env:
          APPROVED_VERSION: ${{ inputs.version }}
          APPROVED_COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, tomllib
          assert os.environ['GITHUB_SHA'] == os.environ['APPROVED_COMMIT'], 'Commit mismatch'
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert version == os.environ['APPROVED_VERSION'], 'Version mismatch'
          runs = json.loads(subprocess.check_output([
              'gh', 'run', 'list', '--repo', os.environ['GITHUB_REPOSITORY'],
              '--workflow', 'toolkit.yml', '--commit', os.environ['GITHUB_SHA'],
              '--json', 'status,conclusion', '--limit', '20']))
          assert any(r['status'] == 'completed' and r['conclusion'] == 'success' for r in runs), 'CI must pass for this exact commit'
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: python tools/check_distribution.py dist/*.whl dist/*.tar.gz
      - run: python -m twine check dist/*
      - name: Verify installation outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/release-consumer"
          "$RUNNER_TEMP/release-consumer/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/release-consumer/bin/python" "$GITHUB_WORKSPACE/tools/check_consumer_contracts.py"
      - run: sha256sum dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/agentinputlab/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pypi-distributions
          path: dist/
      - name: Publish with short-lived PyPI identity
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
