[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentinputlab"
version = "0.1.0a21"
description = "Auditable, intent-aware input intervention for LLM agents"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Chuang Zhao" },
]
keywords = [
  "agents",
  "llm",
  "prompt-optimization",
  "retrieval",
  "benchmark",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]

[project.optional-dependencies]
smartsearch-prepare = ["requests>=2.32,<3", "tqdm>=4.66,<5"]
smartsearch-sample = ["jieba==0.42.1", "langid==1.1.6", "numpy>=1.26,<2"]
