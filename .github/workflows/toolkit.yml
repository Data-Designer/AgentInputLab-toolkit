name: Toolkit validation (no publication)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install '.[dev]'
      - run: ruff check src
      - run: pytest
      - run: npm ci && npm test
        working-directory: packages/sdk
      - run: python -m build
      - run: python tools/check_distribution.py dist/*.whl dist/*.tar.gz
      - run: npm pack --pack-destination ../../dist
        working-directory: packages/sdk
      - run: python tools/check_distribution.py dist/*.tgz
      - name: Install and exercise the packed artifacts outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/installed/bin/pip" install dist/*.whl
          mkdir "$RUNNER_TEMP/sdk-consumer"
          cd "$RUNNER_TEMP/sdk-consumer"
          npm install "$GITHUB_WORKSPACE"/dist/*.tgz
          "$RUNNER_TEMP/installed/bin/python" "$GITHUB_WORKSPACE/tools/installed_sdk_smoke.py"
          "$RUNNER_TEMP/installed/bin/python" "$GITHUB_WORKSPACE/tools/check_consumer_contracts.py"
